name: Enterprise Platform CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Build Packages & Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Monorepo
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies & Run Pytest Suite
        run: |
          cd backend
          pip install -r requirements.txt
          python3 -m pytest tests/test_ai_infrastructure.py tests/test_rule_engine_framework.py tests/test_enterprise_agent_framework.py tests/test_enterprise_integration_platform.py -v

  docker-build-and-push:
    name: Build Production Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ire/backend:latest

  terraform-and-k8s-deploy:
    name: Validate IaC & Deploy to Production Kubernetes (EKS)
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init & Validate
        run: |
          cd infrastructure/terraform
          terraform init -backend=false
          terraform validate

      - name: Validate Kubernetes Production Manifests
        run: |
          kubectl apply -f infrastructure/k8s/ --dry-run=client
