version: '3.8'

services:
  # 1. Nginx Reverse Proxy with SSL Termination & Rate Limiting
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: ire-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - prometheus
      - grafana

  # 2. Production PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ire-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ire_admin
      POSTGRES_PASSWORD: ire_password_production_secure_2026
      POSTGRES_DB: ire_production_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ire_admin -d ire_production_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis In-Memory Cache & Lock Store
  redis:
    image: redis:7-alpine
    container_name: ire-redis-prod
    restart: always
    ports:
      - "6379:6379"

  # 4. Vector Database (Qdrant)
  vector-store:
    image: qdrant/qdrant:v1.7.4
    container_name: ire-vector-store-prod
    restart: always
    ports:
      - "6333:6333"

  # 5. Redpanda / Kafka Event Broker
  redpanda:
    image: docker.redpandadata.com/redpandadata/redpanda:v23.3.5
    container_name: ire-event-broker-prod
    restart: always
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"

  # 6. Python FastAPI Core Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ire-fastapi-backend-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ire_admin
      - POSTGRES_PASSWORD=ire_password_production_secure_2026
      - POSTGRES_DB=ire_production_db
      - REDIS_HOST=redis
      - VECTOR_DB_URL=http://vector-store:6333
      - KAFKA_BROKERS=redpanda:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 7. Prometheus Monitoring Server
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ire-prometheus-prod
    restart: always
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # 8. Grafana Analytics Dashboards
  grafana:
    image: grafana/grafana:10.2.2
    container_name: ire-grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ire_grafana_secure_2026
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # 9. Loki Centralized Log Aggregator
  loki:
    image: grafana/loki:2.9.2
    container_name: ire-loki-prod
    restart: always
    ports:
      - "3100:3100"

volumes:
  postgres_prod_data:
