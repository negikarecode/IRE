global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ire-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'ire-microservices'
    static_configs:
      - targets:
          - 'tenant-identity-service:3001'
          - 'ingestion-service:3002'
          - 'claim-lifecycle-service:3003'
          - 'reasoning-engine-service:3004'
          - 'ai-agent-service:3005'
          - 'audit-ledger-service:3006'
          - 'notification-event-service:3007'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
