kind: Secret
metadata:
  name: ire-secrets
  namespace: ire-production
type: Opaque
stringData:
  SECRET_KEY: "PROD_SUPER_SECRET_KEY_32_BYTES_STRICT_SECURITY"
  POSTGRES_USER: "ire_admin"
  POSTGRES_PASSWORD: "ire_password_production_secure_2026"
