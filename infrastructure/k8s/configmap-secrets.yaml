apiVersion: v1
kind: ConfigMap
metadata:
  name: ire-config
  namespace: ire-production
data:
  PROJECT_NAME: "Enterprise Platform (IRE)"
  POSTGRES_SERVER: "ire-postgres.internal"
  POSTGRES_DB: "ire_production_db"
  REDIS_HOST: "ire-redis.internal"
  CELERY_BROKER_URL: "redis://ire-redis.internal:6379/0"

---
