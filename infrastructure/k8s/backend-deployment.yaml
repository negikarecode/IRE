apiVersion: apps/v1
kind: Deployment
metadata:
  name: ire-backend
  namespace: ire-production
  labels:
    app: ire-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ire-backend
  template:
    metadata:
      labels:
        app: ire-backend
    spec:
      containers:
        - name: backend
          image: ire/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ire-config
            - secretRef:
                name: ire-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ire-backend-service
  namespace: ire-production
spec:
  selector:
    app: ire-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ire-backend-hpa
  namespace: ire-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ire-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
