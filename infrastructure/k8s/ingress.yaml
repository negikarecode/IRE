apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ire-ingress
  namespace: ire-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  tls:
    - hosts:
        - api.ire.health
      secretName: ire-api-tls
  rules:
    - host: api.ire.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ire-backend-service
                port:
                  number: 8000
